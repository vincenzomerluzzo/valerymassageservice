name: Deploy To cPanel (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cpanel-ftp-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CPANEL_FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER || vars.CPANEL_FTP_SERVER }}
      CPANEL_FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME || vars.CPANEL_FTP_USERNAME }}
      CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD || vars.CPANEL_FTP_PASSWORD }}
      CPANEL_FTP_PROTOCOL: ${{ secrets.CPANEL_FTP_PROTOCOL || vars.CPANEL_FTP_PROTOCOL || 'ftps' }}
      CPANEL_FTP_PORT: ${{ secrets.CPANEL_FTP_PORT || vars.CPANEL_FTP_PORT || 21 }}
      CPANEL_FTP_SERVER_DIR: ${{ secrets.CPANEL_FTP_SERVER_DIR || vars.CPANEL_FTP_SERVER_DIR || '/public_html/' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate FTP configuration
        run: |
          missing=0
          if [ -z "${CPANEL_FTP_SERVER}" ]; then
            echo "Missing CPANEL_FTP_SERVER (set Secret or Variable)."
            missing=1
          fi
          if [ -z "${CPANEL_FTP_USERNAME}" ]; then
            echo "Missing CPANEL_FTP_USERNAME (set Secret or Variable)."
            missing=1
          fi
          if [ -z "${CPANEL_FTP_PASSWORD}" ]; then
            echo "Missing CPANEL_FTP_PASSWORD (set Secret or Variable)."
            missing=1
          fi
          if [ "${CPANEL_FTP_PROTOCOL}" != "ftp" ] && [ "${CPANEL_FTP_PROTOCOL}" != "ftps" ]; then
            echo "Invalid CPANEL_FTP_PROTOCOL: '${CPANEL_FTP_PROTOCOL}'. Use 'ftp' or 'ftps'."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.CPANEL_FTP_SERVER }}
          username: ${{ env.CPANEL_FTP_USERNAME }}
          password: ${{ env.CPANEL_FTP_PASSWORD }}
          protocol: ${{ env.CPANEL_FTP_PROTOCOL }}
          port: ${{ env.CPANEL_FTP_PORT }}
          server-dir: ${{ env.CPANEL_FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.DS_Store
            **/.htaccess
            **/cgi-bin/**
            **/error_log
            **/php.ini
            **/wp-admin/**
            **/wp-includes/**
            **/wp-content/**
            **/wp-config.php
            **/xmlrpc.php
            README.md
            package*.json
            .cpanel.yml
            git-hook.php
